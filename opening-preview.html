<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>GPL opening preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0B0402; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Oswald', 'Helvetica Neue', Arial, sans-serif; color: #F6EAD5; -webkit-user-select: none; user-select: none; }
  #cv { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px; background: #1E0F07; z-index: 5; transition: opacity 0.35s; }
  .ui.gone { opacity: 0; pointer-events: none; }
  .ui img { width: 62%; max-width: 250px; height: auto; margin-bottom: 26px; }
  .ui h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 1px; margin: 0 0 6px; text-transform: uppercase; }
  .ui p { margin: 0 0 22px; font-size: 14px; color: #FBC891; letter-spacing: 0.5px; }
  .btn { font: 600 17px 'Oswald', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #1E0F07; background: #E5702F;
         border: 0; border-radius: 10px; padding: 14px 30px; cursor: pointer; }
  .quiet { margin-top: 14px; background: none; border: 0; color: #FBC891; font: 500 14px 'Oswald', sans-serif; letter-spacing: 1px; text-decoration: underline; cursor: pointer; padding: 8px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 0 22px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 4;
         opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .bar.on { opacity: 1; pointer-events: auto; }
  .bar button { font: 600 14px 'Oswald', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #F6EAD5; background: rgba(30,15,7,0.7);
         border: 1px solid #E5702F; border-radius: 999px; padding: 10px 22px; margin: 0 6px; cursor: pointer; }
  .hint { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; letter-spacing: 2px;
          text-transform: uppercase; color: rgba(246,234,213,0.55); z-index: 3; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .hint.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint" id="hint">Tap to skip</div>
<div class="bar" id="bar"><button type="button" id="again">Replay</button><button type="button" id="againQ">Replay, no sound</button></div>
<div class="ui" id="ui">
  <img src="images/gpl-logo-3d.webp" alt="Gunslinger Poker League" onerror="this.style.display='none'">
  <h1>Opening preview</h1>
  <p>Turn your sound up, then tap.</p>
  <button type="button" class="btn" id="go">Tap to enter</button>
  <button type="button" class="quiet" id="goQ">Enter without sound</button>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), c = cv.getContext('2d');
  var W = 380, HH = 600, HZ = 360, FY = 504, SF = 1, PX = 1, OX = 0, VW = 0, VH = 0;
  var T0 = 0.8, WD = 2.5, STEPS = 5, DRAW0 = 3.85, FIRE = 4.15, HIT = 4.23, FALL = 4.68, SLAM = 5.23, END = 9, PI = Math.PI;
  var INK = '#120703', RIM = '#E5702F';
  var logo = new Image(), logoOk = false;
  logo.onload = function () { logoOk = true; };
  logo.src = 'images/gpl-logo-3d.webp';

  function sm(a, b, x) { var u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function poly(g, p) { g.beginPath(); for (var i = 0; i < p.length; i++) g.lineTo(p[i][0], p[i][1]); g.closePath(); }
  function back(u) { var k = 1.70158; u = u - 1; return u * u * ((k + 1) * u + k) + 1; }

  // ---------- layout: a 380-wide stage, as tall as the screen ----------
  function layout() {
    VW = window.innerWidth; VH = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var a = Math.min(VW / VH, 0.75), sw = VH * a;
    if (VW / VH < 0.75) sw = VW;
    var s = sw / W;
    HH = VH / s; OX = (VW - sw) / 2; PX = s * dpr;
    cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
    HZ = Math.round(HH * 0.6); FY = HZ + (HH - HZ) * 0.6; SF = (FY - HZ + 115) / 245;
    IP = { x: 203, y: FY - 150 * SF };
  }
  function stage(g, ox) { g.setTransform(PX, 0, 0, PX, ox, 0); }

  // ---------- the street ----------
  function blds(g) {
    var xs = [-10, 58, 108, 150], col = ['#150A04', '#2B150A', '#4A2210'], lift = [30, 8, 18];
    var slope = (HH - HZ - 6) / 160;
    function top(x) { return HZ - 260 + (x + 10) * 1.5; }
    function bot(x) { return HH - (x + 10) * slope; }
    for (var s = 0; s < 2; s++) for (var i = 2; i >= 0; i--) {
      var a = xs[i], b = xs[i + 1], ty = top(a) - lift[i], m = s ? function (x) { return W - x; } : function (x) { return x; };
      g.fillStyle = col[i];
      poly(g, [[m(a), ty], [m(b), ty + (top(b) - top(a)) * 0.35], [m(b), bot(b)], [m(a), bot(a)]]); g.fill();
      if (i < 2) {
        var wx = (a + b) / 2, hh = bot(wx) - top(wx), ww = (b - a) * 0.22;
        g.fillStyle = 'rgba(244,154,92,' + (i ? 0.3 : 0.45) + ')';
        g.fillRect(m(wx) - ww / 2, top(wx) + hh * 0.46, ww, Math.min(hh * 0.13, 46));
      }
    }
  }
  function walk(t) {
    var u = Math.min(1, Math.max(0, (t - T0) / WD)), e = u * u * u * (u * (u * 6 - 15) + 10);   // eases in and out: no sudden stop
    var amp = 1 - sm(T0 + WD - 0.75, T0 + WD + 0.1, t), ph = PI * STEPS * (1 - Math.pow(1 - u, 1.6)), s = lerp(0.28, SF, e);
    return { u: u, e: e, amp: amp, ph: ph, s: s, fy: lerp(HZ + 8, FY, e), cx: 190 + amp * 5 * s * Math.sin(ph) };
  }
  function taper(g, x1, y1, r1, x2, y2, r2, xt) {            // a limb: thicker at one end than the other
    r1 += xt / 2; r2 += xt / 2;
    var dx = x2 - x1, dy = y2 - y1, l = Math.sqrt(dx * dx + dy * dy) || 1, nx = -dy / l, ny = dx / l;
    g.beginPath(); g.moveTo(x1 + nx * r1, y1 + ny * r1); g.lineTo(x2 + nx * r2, y2 + ny * r2); g.lineTo(x2 - nx * r2, y2 - ny * r2); g.lineTo(x1 - nx * r1, y1 - ny * r1); g.closePath(); g.fill();
    g.beginPath(); g.arc(x1, y1, r1, 0, 7); g.fill(); g.beginPath(); g.arc(x2, y2, r2, 0, 7); g.fill();
  }
  function pistol(g, e) {                                     // a revolver in profile, barrel along +x, grip at 0,0
    g.beginPath(); g.moveTo(-3, -6 - e); g.lineTo(31 + e, -6 - e); g.lineTo(31 + e, -1 + e); g.lineTo(13, -1 + e); g.lineTo(12, 3 + e); g.lineTo(4, 4 + e);
    g.lineTo(-1, 15 + e); g.lineTo(-9 - e, 14 + e); g.lineTo(-6 - e, 1); g.lineTo(-9 - e, -8 - e); g.lineTo(-4, -9 - e); g.closePath(); g.fill();
    g.beginPath(); g.arc(8, -1, 6.5 + e, 0, 7); g.fill();
  }
  function stepT(i) { return T0 + WD * (1 - Math.pow(1 - i / STEPS, 1 / 1.6)); }   // when each foot lands
  function fig(g, t) {
    var k = walk(t), amp = k.amp, ph = k.ph, s = k.s, st = 1 - amp;
    var sn = Math.sin(ph), bob = -amp * 3.5 * sn * sn, roll = amp * 0.04 * sn;
    var d = sm(DRAW0, DRAW0 + 0.17, t), rr = sm(FIRE, FIRE + 0.14, t);
    var fxw = lerp(30, 14, amp), toe = lerp(13, 8, amp);
    var pL = Math.max(0, sn), pR = Math.max(0, -sn), lL = amp * 15 * pL * pL, lR = amp * 15 * pR * pR;   // feet lift and land softly
    var twp = Math.sin(PI * sm(DRAW0 - 0.42, DRAW0 - 0.1, t)), sw = amp * 6 * sn, tw = 1.6 * twp * twp;
    var ln = st * 5, kk = -ln / 85;                           // he leans a little when he plants his feet
    var ex = lerp(lerp(-44, -34, d), -45, rr), ey = lerp(lerp(-148 - sw * 0.4, -172, d), -170, rr);
    var hx = lerp(lerp(-34, -23, d), -39, rr), hy = lerp(lerp(-112 - sw * 0.4 - tw, -165, d), -208, rr);
    var hr = lerp(lerp(6, 9.5, d), 7, rr), fr = lerp(lerp(5.5, 8.5, d), 5.5, rr);
    var phi = lerp(lerp(-1.57, 0.15, d), 0.85, rr), ff = lerp(lerp(1, 0.15, d), 0.95, rr), gs = lerp(lerp(1, 1.5, d), 1.2, rr);
    var pass = 0, xt = 0;
    function P(p) { poly(g, p); g.fill(); if (!pass) { g.lineWidth = xt; g.stroke(); } }
    function E(x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx + xt / 2, ry + xt / 2, 0, 0, 7); g.fill(); }
    g.save(); g.translate(k.cx, k.fy); g.scale(s, s);
    var sh = g.createRadialGradient(0, 40, 2, 0, 40, 60);
    sh.addColorStop(0, 'rgba(18,7,3,0.6)'); sh.addColorStop(1, 'rgba(18,7,3,0)');
    g.save(); g.scale(0.62 + 0.25 * st, 1.15); g.fillStyle = sh; g.beginPath(); g.arc(0, 40, 60, 0, 7); g.fill(); g.restore();
    g.translate(0, bob); g.lineCap = 'round'; g.lineJoin = 'round';
    for (pass = 0; pass < 2; pass++) {
      xt = pass ? 0 : 3.5; g.strokeStyle = g.fillStyle = pass ? INK : RIM;
      var kLx = -fxw * 0.72 - 2, kLy = -56 - lL * 0.6 - bob * 0.5, kRx = fxw * 0.72 + 2, kRy = -56 - lR * 0.6 - bob * 0.5;
      var aL = -9 - lL - bob, aR = -9 - lR - bob;
      taper(g, -10, -104, 11, kLx, kLy, 8.5, xt); taper(g, kLx, kLy, 8.5, -fxw, aL, 6.5, xt);
      taper(g, 10, -104, 11, kRx, kRy, 8.5, xt); taper(g, kRx, kRy, 8.5, fxw, aR, 6.5, xt);
      taper(g, -fxw + 2, aL + 5, 5.5, -fxw - toe, aL + 6, 3.5, xt); taper(g, fxw - 2, aR + 5, 5.5, fxw + toe, aR + 6, 3.5, xt);
      g.save(); g.transform(1, 0, kk, 1, kk * 104, 0); g.translate(0, -104); g.rotate(roll); g.translate(0, 104);
      E(0, -104, 20, 9);
      g.beginPath(); g.moveTo(-31, -186); g.quadraticCurveTo(0, -197, 31, -186); g.quadraticCurveTo(33, -150, 18, -120); g.lineTo(20, -102);
      g.lineTo(-20, -102); g.lineTo(-18, -120); g.quadraticCurveTo(-33, -150, -31, -186); g.closePath(); g.fill(); if (!pass) { g.lineWidth = xt; g.stroke(); }
      taper(g, 29, -183, 8.5, 43, -147 + sw, 7, xt); taper(g, 43, -147 + sw, 7, 39, -110 + sw, 5.5, xt); E(39, -106 + sw, 6, 6);
      P([[-26, -108], [-15, -108], [-17, -78], [-25, -76]]); if (d < 0.15) E(-21, -111, 4.5, 4.5);
      taper(g, 0, -192, 6.5, 0, -200, 6, xt); E(0, -207, 11, 13);
      g.save(); g.translate(0, -216); g.rotate(-0.05); E(0, 0, 33, 3.6); P([[-13, -1], [-14, -18], [14, -18], [13, -1]]); E(0, -18, 14, 2.5); g.restore();
      g.restore();
    }
    g.strokeStyle = 'rgba(229,112,47,0.55)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-17, -111); g.lineTo(18, -104); g.stroke();
    g.save(); g.transform(1, 0, kk, 1, kk * 104, 0); g.translate(0, -104); g.rotate(roll); g.translate(0, 104);   // the gun arm sits on top, so it shows against his body
    for (pass = 0; pass < 2; pass++) {
      xt = pass ? 0 : 3.5; g.strokeStyle = g.fillStyle = pass ? INK : RIM;
      taper(g, -29, -183, 8.5, ex, ey, 7, xt); taper(g, ex, ey, 7, hx, hy, fr, xt);
      if (d > 0.15) { g.save(); g.translate(hx, hy); g.rotate(phi); g.scale(-ff * gs, gs); pistol(g, xt / 2 / gs); g.restore(); }
      E(hx, hy, hr, hr);
    }
    if (ff < 0.45) {                                          // looking straight down the barrel
      var al = Math.min(1, (0.45 - ff) / 0.25), bx = hx - 2, by = hy - 7 * gs;
      g.globalAlpha = al;
      g.fillStyle = RIM; g.beginPath(); g.arc(bx, by, 8 * gs + 1.6, 0, 7); g.fill(); g.fillRect(bx - 1.6 * gs, by - 12.5 * gs, 3.2 * gs, 5 * gs);
      g.fillStyle = INK; g.beginPath(); g.arc(bx, by, 8 * gs, 0, 7); g.fill();
      g.strokeStyle = '#FBC891'; g.lineWidth = 1.7; g.beginPath(); g.arc(bx, by, 4.3 * gs, 0, 7); g.stroke();
      g.fillStyle = '#000'; g.beginPath(); g.arc(bx, by, 2.7 * gs, 0, 7); g.fill();
      g.globalAlpha = 1;
    }
    g.restore();
    g.restore();
    var px = -31 * ff * gs, py = -3.5 * gs, lx = hx + px * Math.cos(phi) - py * Math.sin(phi), ly = hy + px * Math.sin(phi) + py * Math.cos(phi);
    if (ff < 0.45) { lx = hx - 2; ly = hy - 7 * gs; }
    lx += kk * (ly + 104);
    return { x: k.cx + lx * s, y: k.fy + (ly + bob) * s, s: s };
  }
  function scene(g, t) {
    var i, sky = g.createLinearGradient(0, 0, 0, HZ);
    sky.addColorStop(0, '#1F0B06'); sky.addColorStop(0.45, '#8C3716'); sky.addColorStop(0.8, '#E5702F'); sky.addColorStop(1, '#FBC891');
    g.fillStyle = sky; g.fillRect(0, 0, W, HZ + 2);
    var glow = g.createRadialGradient(190, HZ, 40, 190, HZ, 260);
    glow.addColorStop(0, 'rgba(253,230,196,0.55)'); glow.addColorStop(1, 'rgba(253,230,196,0)');
    g.fillStyle = glow; g.fillRect(0, HZ - 260, W, 262);
    g.fillStyle = '#FBC891'; g.beginPath(); g.arc(190, HZ, 92, PI, 0); g.fill();
    g.fillStyle = '#FDE6C4'; g.beginPath(); g.arc(190, HZ, 66, PI, 0); g.fill();
    g.fillStyle = '#7A3413';
    poly(g, [[112, HZ + 1], [128, HZ - 18], [160, HZ - 18], [170, HZ + 1]]); g.fill();
    poly(g, [[214, HZ + 1], [222, HZ - 12], [252, HZ - 12], [264, HZ + 1]]); g.fill();
    var gr = g.createLinearGradient(0, HZ, 0, HH);
    gr.addColorStop(0, '#A04A1C'); gr.addColorStop(0.25, '#5A2710'); gr.addColorStop(1, '#1E0F07');
    g.fillStyle = gr; g.fillRect(0, HZ, W, HH - HZ + 2);
    g.fillStyle = 'rgba(251,200,145,0.10)'; poly(g, [[172, HZ], [208, HZ], [300, HH], [80, HH]]); g.fill();
    blds(g);
    var hz = g.createLinearGradient(0, HZ - 40, 0, HZ + 30);
    hz.addColorStop(0, 'rgba(244,154,92,0)'); hz.addColorStop(0.6, 'rgba(244,154,92,0.22)'); hz.addColorStop(1, 'rgba(244,154,92,0)');
    g.fillStyle = hz; g.fillRect(0, HZ - 40, W, 70);
    for (i = 1; i <= STEPS; i++) {                         // dust kicked up at each footfall
      var tk = stepT(i), age = t - tk;
      if (age < 0 || age > 0.7) continue;
      var k = walk(tk), px = k.cx + (i % 2 ? -1 : 1) * 15 * k.s;
      g.fillStyle = 'rgba(190,120,70,' + (0.4 * (1 - age / 0.7)).toFixed(3) + ')';
      g.beginPath(); g.arc(px, k.fy - 2 - 10 * age * k.s, (3 + 16 * age) * k.s, 0, 7); g.fill();
    }
    var m = fig(g, t);
    if (t > FIRE + 0.05) {                                 // smoke from the barrel
      var sa = Math.min(1, (t - FIRE - 0.05) / 0.15);
      for (i = 0; i < 4; i++) {
        g.fillStyle = 'rgba(246,234,213,' + (sa * (0.34 - 0.07 * i)).toFixed(3) + ')';
        g.beginPath(); g.arc(m.x - (2 + 4 * i) * m.s, m.y - (5 + 11 * i) * m.s, (3.5 + 3 * i) * m.s, 0, 7); g.fill();
      }
    }
    for (i = 0; i < 26; i++) {                             // dust motes in the low sun
      var mx = (rnd(i) * W + t * (6 + 10 * rnd(i + 20))) % W, my = HZ - 120 + rnd(i + 40) * (HH - HZ + 100) + Math.sin(t + i) * 5;
      g.fillStyle = 'rgba(253,230,196,' + (0.12 + 0.25 * rnd(i + 60)).toFixed(3) + ')';
      g.beginPath(); g.arc(mx, my, 0.6 + 1.3 * rnd(i + 80), 0, 7); g.fill();
    }
    return m;
  }

  // ---------- the saloon doors ----------
  function door(g, px, dir, sx) {
    g.save(); g.translate(px, 0); g.scale(dir * sx, 1);
    var y0 = HZ - 118, y1 = HZ + 125;
    g.fillStyle = '#2A1408';
    g.beginPath(); g.moveTo(0, y0); g.quadraticCurveTo(70, y0 - 26, 138, y0 + 8); g.lineTo(138, y1); g.quadraticCurveTo(70, y1 + 23, 0, y1 + 10); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(229,112,47,0.7)'; g.lineWidth = 1.5; g.stroke();
    g.strokeStyle = '#0B0402'; g.lineWidth = 3;
    for (var y = y0 + 28; y < y1 - 5; y += 18) { g.beginPath(); g.moveTo(12, y); g.lineTo(126, y + 2); g.stroke(); }
    g.restore();
  }
  function frame(g, t) {
    var z = sm(0.7, 1.75, t); if (z >= 1) return;
    var k = 1 + 1.1 * z, tau = t - 0.45;
    var a = tau < 0 ? 0 : Math.min(1.5, 1.35 * (1 - Math.exp(-3.2 * tau) * Math.cos(7 * tau)));
    g.save(); g.translate(190, HZ - 20); g.scale(k, k); g.translate(-190, -(HZ - 20));
    g.fillStyle = '#0B0402';
    g.fillRect(-400, -600, 450, HH + 1200); g.fillRect(330, -600, 450, HH + 1200); g.fillRect(40, -600, 300, HZ - 270 + 600);
    g.strokeStyle = 'rgba(229,112,47,0.55)'; g.lineWidth = 2; g.strokeRect(50, HZ - 270, 280, HH + 400);
    if (HZ - 270 > 86) {
      g.font = "30px Anton, Impact, sans-serif"; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillStyle = 'rgba(229,112,47,0.20)'; g.fillRect(96, HZ - 336, 188, 46);
      g.strokeStyle = 'rgba(229,112,47,0.5)'; g.lineWidth = 1.5; g.strokeRect(96, HZ - 336, 188, 46);
      g.fillStyle = 'rgba(251,200,145,0.85)'; g.fillText('S A L O O N', 190, HZ - 301);
    }
    door(g, 50, 1, Math.cos(a)); door(g, 330, -1, Math.cos(a));
    g.restore();
  }

  // ---------- the finale ----------
  function fin(g, t) {
    var i, cy = HH * 0.45, rg = g.createRadialGradient(190, cy, 10, 190, cy, Math.max(HH, 500) * 0.75);
    rg.addColorStop(0, '#8A3815'); rg.addColorStop(0.5, '#3A2013'); rg.addColorStop(1, '#1E0F07');
    g.fillStyle = rg; g.fillRect(0, 0, W, HH);
    g.save(); g.translate(190, cy); g.rotate(t * 0.12); g.fillStyle = 'rgba(244,154,92,0.07)';
    for (i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1400, i * PI / 6, i * PI / 6 + PI / 12); g.closePath(); g.fill(); }
    g.restore();
    var span = HH + 100;
    for (i = 0; i < 44; i++) {
      var sp = 20 + rnd(i) * 36, y = HH - ((t * sp + rnd(i + 50) * span) % span), x = rnd(i + 9) * W + Math.sin(t * 1.3 + i) * 10;
      var al = (0.25 + 0.5 * rnd(i + 3)) * Math.min(1, Math.max(0, y / 220));
      g.fillStyle = 'rgba(244,154,92,' + al.toFixed(3) + ')'; g.beginPath(); g.arc(x, y, 0.8 + 1.7 * rnd(i + 70), 0, 7); g.fill();
    }
    var z = t - SLAM; if (z <= 0) return;
    var u = Math.min(1, z / 0.3), sc = lerp(2.6, 1, back(u) > 1 ? 1 : u * u * (3 - 2 * u)) * (1 + 0.035 * Math.exp(-(z - 0.3) * 6) * (z > 0.3 ? 1 : 0)) + 0.012 * Math.min(4, Math.max(0, z - 0.3));
    var ring = (z - 0.24) / 0.7;
    if (ring > 0 && ring < 1) {
      g.strokeStyle = 'rgba(251,200,145,' + (0.7 * (1 - ring)).toFixed(3) + ')'; g.lineWidth = 6 * (1 - ring) + 1;
      g.beginPath(); g.arc(190, cy, 90 + 420 * ring, 0, 7); g.stroke();
    }
    g.save(); g.globalAlpha = Math.min(1, z / 0.12); g.translate(190, cy); g.scale(sc, sc);
    if (logoOk) {
      var lw = 292, lh = lw * logo.height / logo.width;
      g.drawImage(logo, -lw / 2, -lh / 2, lw, lh);
    } else {
      g.font = "64px Anton, Impact, sans-serif"; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillStyle = '#C9561F'; g.fillText('GUNSLINGER', 3, 3); g.fillStyle = '#F6EAD5'; g.fillText('GUNSLINGER', 0, 0);
      g.font = "600 23px Oswald, sans-serif"; g.fillStyle = '#FBC891'; g.fillText('P O K E R   L E A G U E', 0, 44);
    }
    g.restore();
    var fl = 1 - sm(SLAM + 0.24, SLAM + 0.6, t);
    if (z > 0.24 && fl > 0) { g.fillStyle = 'rgba(255,243,214,' + (0.5 * fl).toFixed(3) + ')'; g.fillRect(0, 0, W, HH); }
  }

  // ---------- the glass ----------
  var IP = { x: 203, y: 290 }, NR = 14, V = [], SH = [], snap = null;
  function buildGlass() {
    var i, j, far = Math.max(HH, W) * 1.3, RG = [7, 50, 125, 240, far];
    V = []; SH = [];
    for (i = 0; i < NR; i++) {
      var a = (i + (rnd(i) - 0.5) * 0.6) / NR * 2 * PI; V[i] = [];
      for (j = 0; j < 5; j++) { var r = RG[j] * (j && j < 4 ? 0.8 + 0.4 * rnd(i * 7 + j) : 1); V[i][j] = [IP.x + r * Math.cos(a), IP.y + r * Math.sin(a), r]; }
    }
    snap = document.createElement('canvas'); snap.width = Math.ceil(W * PX); snap.height = Math.ceil(HH * PX);
    var sg = snap.getContext('2d'); stage(sg, 0); scene(sg, FIRE + 0.3); vignette(sg);
    for (i = 0; i < NR; i++) for (j = 0; j < 4; j++) {
      var n = (i + 1) % NR, p = [V[i][j], V[n][j], V[n][j + 1], V[i][j + 1]];
      var x0 = Math.max(0, Math.min(p[0][0], p[1][0], p[2][0], p[3][0])), x1 = Math.min(W, Math.max(p[0][0], p[1][0], p[2][0], p[3][0]));
      var y0 = Math.max(0, Math.min(p[0][1], p[1][1], p[2][1], p[3][1])), y1 = Math.min(HH, Math.max(p[0][1], p[1][1], p[2][1], p[3][1]));
      if (x1 - x0 < 1 || y1 - y0 < 1) continue;
      var pc = document.createElement('canvas'); pc.width = Math.ceil((x1 - x0) * PX) + 2; pc.height = Math.ceil((y1 - y0) * PX) + 2;
      var pg = pc.getContext('2d'); pg.setTransform(PX, 0, 0, PX, -x0 * PX, -y0 * PX);
      poly(pg, p); pg.save(); pg.clip(); pg.drawImage(snap, 0, 0, W, HH);
      pg.fillStyle = 'rgba(255,243,214,' + (0.03 + 0.07 * rnd(i * 5 + j)).toFixed(3) + ')'; pg.fillRect(0, 0, W, HH); pg.restore();
      pg.strokeStyle = 'rgba(246,234,213,0.65)'; pg.lineWidth = 1; pg.stroke();
      var mx = (x0 + x1) / 2, my = (y0 + y1) / 2, ds = Math.min(420, Math.sqrt((mx - IP.x) * (mx - IP.x) + (my - IP.y) * (my - IP.y)));
      SH.push({ cv: pc, x0: x0, y0: y0, w: pc.width / PX, h: pc.height / PX, cx: mx, cy: my,
                dl: ds / 420 * 0.38 + rnd(i * 13 + j) * 0.12, rot: (rnd(i * 3 + j * 5) - 0.5) * 5, a: Math.atan2(my - IP.y, mx - IP.x) });
    }
  }
  function cracks(gp) {
    var R = gp * Math.max(HH, W) * 1.3, i, j;
    c.strokeStyle = 'rgba(246,234,213,0.85)'; c.lineWidth = 1; c.beginPath();
    for (i = 0; i < NR; i++) for (j = 0; j < 4; j++) {
      var a = V[i][j], b = V[i][j + 1], n = V[(i + 1) % NR][j];
      if (a[2] >= R) continue;
      var f = Math.min(1, (R - a[2]) / (b[2] - a[2]));
      c.moveTo(a[0], a[1]); c.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f));
      if (j > 0) { c.moveTo(a[0], a[1]); c.lineTo(n[0], n[1]); }
    }
    c.stroke();
    c.fillStyle = '#0B0402'; c.beginPath(); for (i = 0; i < NR; i++) c.lineTo(V[i][0][0], V[i][0][1]); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1.5; c.stroke();
  }
  function shards(t) {
    for (var i = 0; i < SH.length; i++) {
      var s = SH[i], tau = t - FALL - s.dl, dx = 0, dy = 0, ro = 0, sc = 1;
      if (tau > 0) { dx = Math.cos(s.a) * 80 * tau; dy = Math.sin(s.a) * 40 * tau + 1000 * tau * tau; ro = s.rot * tau; sc = 1 + 0.5 * tau; if (dy > HH + 300) continue; }
      c.save(); c.translate(s.cx + dx, s.cy + dy); c.rotate(ro); c.scale(sc, sc);
      c.drawImage(s.cv, s.x0 - s.cx, s.y0 - s.cy, s.w, s.h);
      c.restore();
    }
  }
  function vignette(g) {
    var v = g.createRadialGradient(190, HH * 0.5, HH * 0.3, 190, HH * 0.5, HH * 0.78);
    v.addColorStop(0, 'rgba(11,4,2,0)'); v.addColorStop(1, 'rgba(11,4,2,0.55)');
    g.fillStyle = v; g.fillRect(0, 0, W, HH);
  }
  function draw(t) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
    c.fillStyle = '#0B0402'; c.fillRect(0, 0, cv.width, cv.height);
    var dpr = cv.width / VW;
    stage(c, OX * dpr);
    c.save(); c.beginPath(); c.rect(0, 0, W, HH); c.clip();
    if (t < HIT) {
      var punch = t > DRAW0 ? 1 + 0.03 * sm(DRAW0, FIRE, t) : 1;
      c.save(); c.translate(190, FY - 120 * SF); c.scale(punch, punch); c.translate(-190, -(FY - 120 * SF));
      var m = scene(c, t); c.restore();
      frame(c, t); vignette(c);
      var fi = 1 - sm(0, 0.45, t);
      if (fi > 0) { c.fillStyle = 'rgba(11,4,2,' + fi.toFixed(3) + ')'; c.fillRect(0, 0, W, HH); }
      if (t >= FIRE) {
        var f = (t - FIRE) / (HIT - FIRE), rad = 30 + (HH + 300) * f;
        c.fillStyle = '#FFF3D6'; c.save(); c.translate(m.x, m.y); c.beginPath();
        for (var i = 0; i < 16; i++) { var q = i % 2 ? rad * 0.55 : rad, an = i * PI / 8; c.lineTo(q * Math.cos(an), q * Math.sin(an)); }
        c.closePath(); c.fill(); c.restore();
      }
    } else {
      c.save();
      var sk = 0;
      if (t < HIT + 0.25) sk = (1 - (t - HIT) / 0.25) * 5;
      else if (t > SLAM + 0.24 && t < SLAM + 0.6) sk = (1 - (t - SLAM - 0.24) / 0.36) * 7;
      if (sk) c.translate(Math.sin(t * 95) * sk * 0.5, Math.cos(t * 78) * sk * 0.5);
      fin(c, t);
      if (t < FALL) { c.drawImage(snap, 0, 0, W, HH); cracks(sm(HIT, HIT + 0.3, t)); } else shards(t);
      c.restore();
      if (t > SLAM) vignette(c);
      var wf = 1 - sm(HIT, HIT + 0.3, t);
      if (wf > 0) { c.fillStyle = 'rgba(255,243,214,' + wf.toFixed(3) + ')'; c.fillRect(0, 0, W, HH); }
    }
    c.restore();
  }

  // ---------- sound: all made in the browser, no files ----------
  var AC = window.AudioContext || window.webkitAudioContext, ac = null, noiseBuf = null, bus = null;
  function audioInit() {
    if (ac || !AC) return;
    ac = new AC();
    var n = ac.sampleRate * 2, d; noiseBuf = ac.createBuffer(1, n, ac.sampleRate); d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, at, peak, dur, att) {
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), at + (att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  }
  function noise(out, at, dur, type, f0, f1, peak, q, att) {
    var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.Q.value = q || 0.7;
    f.frequency.setValueAtTime(f0, at); if (f1) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
    env(g, at, peak, dur, att); s.connect(f); f.connect(g); g.connect(out); s.start(at); s.stop(at + dur + 0.05);
  }
  function tone(out, at, dur, type, f0, f1, peak, att) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    env(g, at, peak, dur, att); o.connect(g); g.connect(out); o.start(at); o.stop(at + dur + 0.05);
  }
  function pluck(out, at, freq, peak, dur) {                // a plucked steel string
    var sr = ac.sampleRate, n = Math.floor(sr * dur), N = Math.max(2, Math.round(sr / freq)), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0), i;
    for (i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;
    for (i = N; i < n; i++) d[i] = (d[i - N] + d[i - N + 1]) * 0.4975;
    var s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = peak;
    g.gain.setValueAtTime(peak, at + dur - 0.3); g.gain.linearRampToValueAtTime(0, at + dur);
    s.connect(g); g.connect(out); s.start(at);
  }
  function finale(out, at) {
    tone(out, at + 0.24, 0.8, 'sine', 95, 34, 0.9); noise(out, at + 0.24, 0.35, 'lowpass', 500, 90, 0.5);
    var ch = [82.41, 123.47, 164.81, 196.0, 246.94, 329.63];
    for (var i = 0; i < ch.length; i++) pluck(out, at + 0.3 + i * 0.03, ch[i], 0.22, 3.2);
    tone(out, at + 0.3, 2.8, 'sine', 659.25, 0, 0.07); tone(out, at + 0.3, 1.8, 'sine', 1318.5, 0, 0.03);
  }
  function soundtrack(b0) {
    bus = ac.createGain(); bus.gain.value = 0.9; bus.connect(ac.destination);
    var i, w = ac.createBufferSource(), wf = ac.createBiquadFilter(), wg = ac.createGain();
    w.buffer = noiseBuf; w.loop = true; wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = 0.6;
    wg.gain.setValueAtTime(0.0001, b0); wg.gain.linearRampToValueAtTime(0.07, b0 + 0.8); wg.gain.linearRampToValueAtTime(0.05, b0 + FIRE); wg.gain.linearRampToValueAtTime(0.0001, b0 + FIRE + 0.1);
    w.connect(wf); wf.connect(wg); wg.connect(bus); w.start(b0); w.stop(b0 + FIRE + 0.2);
    noise(bus, b0 + 0.45, 0.12, 'lowpass', 300, 120, 0.45);                       // doors: thump and creak
    tone(bus, b0 + 0.47, 0.55, 'sawtooth', 210, 330, 0.035, 0.08); tone(bus, b0 + 0.95, 0.4, 'sawtooth', 300, 230, 0.02, 0.08);
    for (i = 1; i <= STEPS; i++) {                                              // boots and spurs, getting closer
      var at = b0 + stepT(i), v = 0.35 + 0.65 * i / STEPS;
      noise(bus, at, 0.1, 'lowpass', 220, 90, 0.5 * v); tone(bus, at, 0.09, 'sine', 80, 45, 0.4 * v);
      tone(bus, at + 0.035, 0.07, 'triangle', 2700, 0, 0.035 * v); tone(bus, at + 0.05, 0.09, 'triangle', 3500, 0, 0.03 * v);
    }
    noise(bus, b0 + DRAW0 - 0.3, 0.03, 'highpass', 2600, 0, 0.18); noise(bus, b0 + DRAW0 - 0.18, 0.03, 'highpass', 3200, 0, 0.22);   // the hammer
    noise(bus, b0 + FIRE, 0.5, 'lowpass', 7000, 350, 1.0, 0.5, 0.002);           // the shot
    tone(bus, b0 + FIRE, 0.3, 'sine', 130, 38, 0.9, 0.002); noise(bus, b0 + FIRE + 0.05, 1.3, 'bandpass', 900, 500, 0.14, 0.8, 0.05);
    noise(bus, b0 + HIT, 0.18, 'highpass', 4200, 0, 0.3);                         // the glass cracks...
    for (i = 0; i < 6; i++) tone(bus, b0 + HIT + rnd(i + 5) * 0.3, 0.12, 'sine', 3000 + 4000 * rnd(i + 11), 0, 0.05);
    noise(bus, b0 + FALL, 0.8, 'highpass', 3000, 5000, 0.32, 0.7, 0.02);          // ...and falls
    for (i = 0; i < 16; i++) tone(bus, b0 + FALL + 0.05 + rnd(i + 31) * 0.75, 0.1 + 0.2 * rnd(i), 'sine', 2500 + 5500 * rnd(i + 17), 0, 0.045);
    finale(bus, b0 + SLAM);
  }

  // ---------- running it ----------
  var raf = null, base = 0, useAudio = false, done = false, skipped = false;
  var ui = document.getElementById('ui'), bar = document.getElementById('bar'), hint = document.getElementById('hint');
  function now() { return useAudio && ac ? ac.currentTime : performance.now() / 1000; }
  function tick() {
    var t = now() - base;
    draw(Math.min(Math.max(t, 0), END));
    if (t > SLAM + 0.2) hint.className = 'hint';
    if (t > SLAM + 2 && !done) { done = true; bar.className = 'bar on'; }
    raf = t < END ? requestAnimationFrame(tick) : null;
  }
  function play(withSound) {
    if (raf) cancelAnimationFrame(raf);
    if (bus) { try { bus.gain.value = 0; bus.disconnect(); } catch (e) {} bus = null; }
    layout(); buildGlass();
    done = false; skipped = false; bar.className = 'bar'; ui.className = 'ui gone'; hint.className = 'hint on';
    useAudio = false;
    if (withSound) {
      audioInit();
      if (ac) { if (ac.state === 'suspended' && ac.resume) ac.resume(); useAudio = true; base = ac.currentTime + 0.08; soundtrack(base); }
    }
    if (!useAudio) base = performance.now() / 1000 + 0.05;
    raf = requestAnimationFrame(tick);
  }
  function skip() {
    var t = now() - base;
    if (skipped || t >= SLAM - 0.1 || t < 0.2) return;
    skipped = true; hint.className = 'hint';
    if (bus) { try { bus.gain.value = 0; bus.disconnect(); } catch (e) {} bus = null; }
    base = now() - (SLAM - 0.05);
    if (useAudio && ac) { bus = ac.createGain(); bus.gain.value = 0.9; bus.connect(ac.destination); finale(bus, base + SLAM); }
  }
  document.getElementById('go').addEventListener('click', function () { play(true); });
  document.getElementById('goQ').addEventListener('click', function () { play(false); });
  document.getElementById('again').addEventListener('click', function (e) { e.stopPropagation(); play(true); });
  document.getElementById('againQ').addEventListener('click', function (e) { e.stopPropagation(); play(false); });
  cv.addEventListener('click', skip);
  window.addEventListener('resize', function () { if (!raf) { layout(); buildGlass(); draw(END); } });
  window.__gplPreview = { draw: function (t) { draw(t); }, init: function () { layout(); buildGlass(); } };
  layout();
})();
</script>
